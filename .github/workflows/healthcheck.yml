name: Health Check
on:
  schedule:
    - cron: '0 0 * * *' # daily at midnight
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: URL Health Check
        uses: jakejarvis/url-health-check@v1
        with:
          url: 'https://your-app.onrender.com/health'
