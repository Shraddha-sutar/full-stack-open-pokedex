name: Full CI/CD Pipeline

# Trigger on main branch push and pull requests to main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize]
  workflow_dispatch: # Manual trigger

jobs:
  build_test_deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the code
      - uses: actions/checkout@v4

      # 2. Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install backend dependencies
      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      # 4. Lint backend
      - name: Lint backend
        run: |
          cd backend
          npm run lint || echo "Lint warnings"

      # 5. Run backend tests
      - name: Test backend
        run: |
          cd backend
          npm test

      # 6. Install frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      # 7. Lint frontend
      - name: Lint frontend
        run: |
          cd frontend
          npm run lint || echo "Lint warnings"

      # 8. Build frontend
      - name: Build frontend
        run: |
          cd frontend
          npm run build

      # 9. Run E2E tests (optional)
      - name: E2E tests
        run: |
          cd frontend
          npx cypress run || echo "E2E test failed"

      # 10. Deployment (Render)
      - name: Deploy to Render
        if: ${{ github.event_name == 'push' }}
        run: |
          curl "https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_API_KEY }}"

      # 11. Discord notification success
      - name: Notify Discord (Success)
        if: success()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_MESSAGE: "✅ New version deployed successfully!"

      # 12. Discord notification failure
      - name: Notify Discord (Failure)
        if: failure()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_MESSAGE: "❌ Build failed on commit ${{ github.sha }}"

  tag_release:
    needs: [build_test_deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.64.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: "patch"
        if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
